<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1024"/>
      <stop offset="0.55" stop-color="#182A55"/>
      <stop offset="1" stop-color="#321B57"/>
    </linearGradient>
    <linearGradient id="upperGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECFBFF" stop-opacity="0.86"/>
      <stop offset="0.42" stop-color="#8EDAF6" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#5961C9" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="lowerGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BE7FF" stop-opacity="0.52"/>
      <stop offset="0.58" stop-color="#5274D3" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#B16BDF" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A4F2FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#BDF7FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#9F9BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="smallBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="32" y="32" width="960" height="960" rx="220"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#background)"/>
  <g clip-path="url(#iconClip)">
    <ellipse cx="235" cy="230" rx="300" ry="220" fill="#4EDCFF" opacity="0.18" filter="url(#softBlur)"/>
    <ellipse cx="815" cy="820" rx="300" ry="250" fill="#A35CFF" opacity="0.2" filter="url(#softBlur)"/>

    <path d="M183 284 Q190 254 226 246 L790 246 Q824 250 834 282 L783 525 L237 525 Z"
          fill="url(#upperGlass)" stroke="#C9F7FF" stroke-opacity="0.58" stroke-width="8"/>
    <path d="M237 525 L783 525 L849 707 Q858 733 826 744 L207 744 Q176 734 185 705 Z"
          fill="url(#lowerGlass)" stroke="#9DEBFF" stroke-opacity="0.42" stroke-width="8"/>

    <path d="M218 302 Q232 274 265 270 L766 270 Q798 272 808 302 L763 493 L254 493 Z"
          fill="#DDF9FF" opacity="0.13" filter="url(#smallBlur)"/>
    <path d="M241 527 L779 527" stroke="url(#edgeGlow)" stroke-width="17" opacity="0.9" filter="url(#smallBlur)"/>
    <path d="M241 525 L779 525" stroke="#C9FAFF" stroke-width="6" opacity="0.92"/>

    <path d="M303 302 L716 302" stroke="url(#reflection)" stroke-width="20" stroke-linecap="round" opacity="0.4"/>
    <path d="M331 350 L690 350" stroke="#DDFBFF" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
    <path d="M326 571 L693 571" stroke="#D6F8FF" stroke-width="8" stroke-linecap="round" opacity="0.18"/>
    <path d="M365 615 L654 615" stroke="#D6F8FF" stroke-width="7" stroke-linecap="round" opacity="0.12"/>

    <path d="M266 791 Q512 846 758 791" fill="none" stroke="#A7EFFF" stroke-width="7" opacity="0.22"/>
    <path d="M305 818 Q512 860 719 818" fill="none" stroke="#B891FF" stroke-width="5" opacity="0.18"/>
  </g>
  <rect x="38" y="38" width="948" height="948" rx="214" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6"/>
</svg>
